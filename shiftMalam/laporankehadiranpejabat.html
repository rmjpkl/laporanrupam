<!doctype html>
<html lang="id" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LAPORAN KEHADIRAN PEJABAT</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

    <style type="text/css">
      body {
        background-color: rgb(95, 62, 255);
      }
      .form-container {
        background-color: #ffffff;
        padding: 20px;
        border-radius: 8px;
        margin-top: 20px;
        margin-bottom: 20px;
      }
      #send_form {
        color: #fff;
        background: #4e4e4e;
        text-decoration: none;
        display: inline-block;
        padding: 10px 25px;
        border-radius: 0.3rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        font-size: 15px;
        width: 100%;
        text-align: center;
        border: none;
        cursor: pointer;
      }
      #send_form:hover {
        background: #333333;
      }
      #output {
        width: 100%;
        min-height: 80px;
        padding: 15px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-family: monospace;
        font-size: 0.95em;
        line-height: 1.5;
        resize: vertical;
        box-sizing: border-box;
        background-color: #f8f9fa;
        margin-top: 15px;
        white-space: pre-wrap;
      }
      .copy-button-container {
        text-align: right;
        margin-top: 10px;
      }
      #copyButton {
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 8px 15px;
        cursor: pointer;
        font-size: 0.9em;
      }
      #copyButton:hover {
        background-color: #218838;
      }
    </style>
  </head>

  <body>
    <div class="container-sm" style="max-width: 600px">
      <div class="form-container">
        <h2 class="text-center mb-4">LAPORAN KEHADIRAN PEJABAT</h2>
        <form id="kehadiranForm">
          <fieldset class="form-group border p-3">
            <!-- Input Autocomplete Nama -->
            <div class="mb-3">
              <label class="form-label fw-bold">Nama Pejabat</label>
              <input
                class="form-control"
                list="daftarPejabat"
                id="namaPejabat"
                placeholder="Ketik atau pilih nama pejabat..."
                required
              />
              <datalist id="daftarPejabat">
                <option value="Windu Ari Agung (Kasubsi Perawatan)"></option>
                <option value="Indarto Adiputra (Kasubsi Keamanan)"></option>
                <option value="Amin Aunur Rofiq (Kasubsi Peltatib)"></option>
                <option value="Mono Puswanto ( Kaur Kepeg dan Keu)"></option>
                <option value="Rizal Eka PM (Kaur Umum)"></option>
                <option
                  value="Satria Agung Wibowo (Kasubsi Registrasi)"
                ></option>
                <option value="Desdy Purwanto (Kasubsi Giatja)"></option>
                <option value="Amin Junaedi (Kasi Kamtib)"></option>
                <option value="D Ardhyna Bintara (Kasubbag TU)"></option>
                <option value="Sigit Riyanto (Ka.KPLP)"></option>
                <option value="Mu'ammar (Kasi Binadik)"></option>
              </datalist>
            </div>

            <!-- Input Radio Button Peran -->
            <div class="mb-3">
              <label class="form-label fw-bold">Peran (Opsional)</label>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  name="peranRadio"
                  id="perwiraPiket"
                  value="perwira piket"
                />
                <label class="form-check-label" for="perwiraPiket">
                  1. Perwira Piket
                </label>
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  name="peranRadio"
                  id="pengawasUmum"
                  value="pengawas umum"
                />
                <label class="form-check-label" for="pengawasUmum">
                  2. Pengawas Umum
                </label>
              </div>
            </div>

            <div class="mb-2 text-end">
              <button
                type="button"
                class="btn btn-sm btn-outline-secondary"
                onclick="resetRadio()"
              >
                Clear Pilihan Peran
              </button>
            </div>
          </fieldset>

          <button
            class="mt-3"
            id="send_form"
            type="button"
            onclick="generateLaporan()"
          >
            <i class="fa fa-file-alt"></i> Generate Laporan
          </button>
        </form>

        <textarea id="output" style="display: none"></textarea>

        <div
          class="copy-button-container"
          id="copyContainer"
          style="display: none"
        >
          <button id="copyButton" onclick="copyToClipboard()">
            <i class="fa fa-copy"></i> Copy Laporan
          </button>
        </div>
      </div>
    </div>

    <script type="text/javascript">
      // Fungsi untuk mengosongkan radio button
      function resetRadio() {
        var radios = document.getElementsByName("peranRadio");
        for (var i = 0; i < radios.length; i++) {
          radios[i].checked = false;
        }
      }

      function generateLaporan() {
        // Ambil nilai input
        var nama = document.getElementById("namaPejabat").value.trim();
        var peranElemen = document.querySelector(
          'input[name="peranRadio"]:checked',
        );

        // Validasi
        if (!nama) {
          alert("Mohon isi nama pejabat terlebih dahulu!");
          return;
        }

        var laporan = "";

        // Cek apakah radio button dipilih
        if (peranElemen) {
          var peran = peranElemen.value;
          laporan = `Izin melaporkan Bapak ${nama} selaku ${peran} hadir di kantor dalam keadaan aman`;
        } else {
          // Jika radio button kosong
          laporan = `Izin melaporkan ${nama} hadir di kantor dalam keadaan aman`;
        }

        // Tampilkan hasil
        const outputElement = document.getElementById("output");
        outputElement.value = laporan;
        outputElement.style.display = "block";

        // Munculkan tombol copy
        document.getElementById("copyContainer").style.display = "block";
      }

      function copyToClipboard() {
        const outputElement = document.getElementById("output");
        outputElement.select();
        outputElement.setSelectionRange(0, 99999);

        navigator.clipboard
          .writeText(outputElement.value)
          .then(() => {
            const btn = document.getElementById("copyButton");
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa fa-check"></i> Copied!';
            setTimeout(() => {
              btn.innerHTML = originalText;
            }, 2000);
          })
          .catch((err) => {
            console.error("Gagal menyalin: ", err);
            alert("Gagal menyalin teks.");
          });
      }
    </script>
  </body>
</html>
